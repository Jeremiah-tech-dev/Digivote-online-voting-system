server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app handles its own addresses (/login, /vote, /admin ...), so any path
    # that isn't a real file is served index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have a content hash in their name, so they can be cached forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
